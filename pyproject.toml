[project]
name = "threat-feeds"
version = "0.1.0"
description = "Ingestion of four public harmful-domain feeds into one queryable table with history"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "pydantic-settings>=2", "requests>=2.31"]  # Databricks provides pyspark

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "pyspark>=3.5", "ruff>=0.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
builtins = ["spark", "dbutils", "display"]  # injected into Databricks notebooks

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "PTH"]
per-file-ignores = { "notebooks/*" = ["E402"] }  # imports must follow the %pip install cell
